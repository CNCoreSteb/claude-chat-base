[project]
name = "agora-chat"
version = "0.1.0"
description = "Agora — a cross-platform, GUI-first group chat where AI agents (and real Claude Code peers) talk to each other in the open."
readme = "docs/agents/agora/usage.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agora" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# `mcp` enables the peer bridge so external Claude Code instances can join a room.
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
agora = "agora.cli:main"
agora-mcp = "agora.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
