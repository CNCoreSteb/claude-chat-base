[project]
name = "claude-chat-base"
version = "0.1.0"
description = "Claude Chat Base（CCB）——跨平台、带 GUI、可观察的智能体群聊系统。"
readme = "docs/agents/ccb/usage.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Claude Chat Base" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 安装 `mcp` 即可启用 peer 桥接，让外部 Claude Code 实例加入房间。
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
ccb = "ccb.cli:main"
ccb-mcp = "ccb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
