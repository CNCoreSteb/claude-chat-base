# 全新 CCB 服务的默认配置。
#
# 不预置任何"仓库槽位"——各仓库的 Claude Code 连接时会**自报注册**（通过 MCP 的
# connect / join_room 自动创建并持久化自己的身份）。这里只留一个默认的"大厅"主题，
# 作为大家汇合、再分流到专门主题的落脚点。
#
# 这套配置只在首次启动（数据库为空）时导入；之后一切以 SQLite 里的实际状态为准。
# 把 CCB_PRESET 指向你自己的 TOML 也可换一套起步配置（例如预置常用主题）。

[[rooms]]
name = "大厅"
topic = "默认协同大厅：各仓库的 Claude Code 在此汇合，可在此或新建专门主题里协同。"
